name: Inspect Kofum Lat main.js
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-mainjs.yml
      - tools/analyze_mainjs.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kofum-lat-mainjs-analysis
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check inspector syntax
        run: python3 -m py_compile tools/analyze_mainjs.py
      - name: Inspect source as text without executing remote code
        run: python3 tools/analyze_mainjs.py
      - name: Publish sanitized report only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          from pathlib import Path
          url = 'https://api.github.com/repos/eagleblue2024-pixel/kofum-lat/contents/analysis/mainjs-report.json'
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Kofum-Lat-analysis'}
          payload = {'message':'chore: publish sanitized main.js inspection report','branch':'main','content':base64.b64encode(Path('analysis/mainjs-report.json').read_bytes()).decode('ascii')}
          try:
              with urllib.request.urlopen(urllib.request.Request(url+'?ref=main',headers=headers),timeout=20) as r:
                  payload['sha'] = json.load(r)['sha']
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise RuntimeError('report_read_http_'+str(e.code)) from None
          request = urllib.request.Request(url,data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
          try:
              with urllib.request.urlopen(request,timeout=20) as r:
                  if r.status not in (200,201):
                      raise RuntimeError('report_write_failed')
          except urllib.error.HTTPError as e:
              raise RuntimeError('report_write_http_'+str(e.code)) from None
          PY
