name: Observe Streamwish routing in isolated Chromium
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/browser-routing.yml
      - tools/browser_routing.py
      - tools/sandbox_launcher.py
      - tools/follow_hglamioz.py
      - tools/capture_routing_lists.py
      - tools/instrument_routing.cjs
      - tools/extract_jw_hls.cjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kofum-lat-isolated-browser
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Initialize sanitized status then check Python policies
        id: policies
        timeout-minutes: 1
        run: |
          mkdir -p analysis "$RUNNER_TEMP/kofum-home"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/kofum-browsers" >> "$GITHUB_ENV"
          printf '%s\n' '{"status":"dependency_setup_not_completed","scope":"No browser or source execution result yet."}' > analysis/browser-routing-report.json
          printf '%s\n' python_policy_checks > analysis/browser-routing-stage.txt
          python3 tools/browser_routing.py --self-test
          python3 tools/sandbox_launcher.py --self-test
          python3 tools/follow_hglamioz.py --self-test
          python3 tools/capture_routing_lists.py --self-test
          printf '%s\n' node_setup > analysis/browser-routing-stage.txt
      - uses: actions/setup-node@v6
        id: node
        timeout-minutes: 1
        with:
          node-version: '20.20.1'
      - name: Check bundled AST parser using synthetic fixtures only
        id: ast
        timeout-minutes: 1
        run: |
          printf '%s\n' ast_checks > analysis/browser-routing-stage.txt
          node --expose-internals tools/instrument_routing.cjs --self-test
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('tools/extract_jw_hls.cjs')
          repository_sha256 = hashlib.sha256(p.read_bytes()).hexdigest()
          source = p.read_text()
          start = source.index('function hls(value){')
          end = source.index('\nfunction extract(source){', start)
          old = source[start:end]
          if old.count("fail('jw_source_url_rejected')") != 3:
              raise RuntimeError('unexpected_url_validator_shape')
          new = r"function hls(value){if(value==='')return false;if(value.length>16000)fail('jw_url_length_rejected');if(/[^\x21-\x7e]/.test(value))fail('jw_url_characters_rejected');let p;try{p=new URL(value);}catch(_){if(value.startsWith('//'))fail('jw_url_network_relative_rejected');if(value.startsWith('/'))fail('jw_url_root_relative_rejected');if(value.startsWith('?'))fail('jw_url_query_relative_rejected');if(value.startsWith('#'))fail('jw_url_fragment_relative_rejected');if(/^[a-z][a-z0-9+.-]*:/i.test(value))fail('jw_url_absolute_malformed_rejected');fail('jw_url_path_relative_rejected');}if(p.protocol!=='https:')fail('jw_url_protocol_rejected');if(p.username||p.password)fail('jw_url_credentials_rejected');if(p.hash)fail('jw_url_fragment_rejected');if(p.port&&p.port!=='443')fail('jw_url_port_rejected');return p.pathname.toLowerCase().endsWith('.m3u8');}"
          source = source[:start] + new + source[end:]
          root_helper = r'''function rootSource(value,origin=process.env.KOFUM_JW_ORIGIN){
           if(!value.startsWith('/'))return value;
           if(value.startsWith('//'))fail('jw_url_network_relative_rejected');
           if(value.length>16000||/[^\x21-\x7e]/.test(value))fail('jw_url_relative_characters_rejected');
           if(value.includes('\\'))fail('jw_url_relative_backslash_rejected');
           if(/%(?:2f|5c)/i.test(value.split(/[?#]/,1)[0]))fail('jw_url_relative_encoded_separator_rejected');
           if(!origin)fail('jw_url_relative_origin_missing');
           let base;try{base=new URL(origin);}catch(_){fail('jw_url_relative_origin_rejected');}
           if(base.protocol!=='https:'||base.port||origin!==base.origin+'/'||!['hglamioz.com','hgplaycdn.com','medixiru.com','niramirus.com','playnixes.com'].includes(base.hostname))fail('jw_url_relative_origin_rejected');
           let resolved;try{resolved=new URL(value,base);}catch(_){fail('jw_url_relative_parse_rejected');}
           if(resolved.origin!==base.origin||resolved.username||resolved.password||value.includes('#'))fail('jw_url_relative_components_rejected');
           if(!resolved.pathname.toLowerCase().endsWith('.m3u8'))fail('jw_url_root_relative_not_hls');
           return resolved.href;
          }'''
          static_marker = "function staticString(n){const value=primitive(n);if(typeof value!=='string')fail('jw_source_result_not_string');return value;}"
          if source.count(static_marker)!=1:
              raise RuntimeError('unexpected_static_string_shape')
          source = source.replace(static_marker,static_marker.replace('return value;','return rootSource(value);'))
          source = source.replace('function hls(value){',root_helper+'\nfunction hls(value){',1)
          marker = ' let passed=0;for(const source of positives)'
          total_marker = 'total:positives.length+negatives.length'
          if source.count(marker) != 1 or source.count(total_marker) != 1:
              raise RuntimeError('unexpected_source_test_shape')
          extra = r''' const mixed=values=>'jwplayer("v").setup({sources:['+values.map(value=>'{file:'+JSON.stringify(value)+'}').join(',')+']});';
           positives.push(mixed(['',url]),mixed([url,'']));
           negatives.push(mixed(['']),mixed(['//cdn.fixture.net/master.m3u8',url]),mixed(['http://cdn.fixture.net/master.m3u8',url]),mixed(['',url,'https://cdn.fixture.net/other.m3u8']));
           const diagnosticCases=[['//cdn.fixture.net/master.m3u8','jw_url_network_relative_rejected'],['/master.m3u8','jw_url_root_relative_rejected'],['master.m3u8','jw_url_path_relative_rejected'],['?token=private','jw_url_query_relative_rejected'],['#private','jw_url_fragment_relative_rejected'],['https://','jw_url_absolute_malformed_rejected'],['https://[invalid]/master.m3u8','jw_url_absolute_malformed_rejected']];
           let diagnosticPassed=0;for(const [value,expected] of diagnosticCases){let actual='';try{hls(value);}catch(error){actual=error.message;}if(actual!==expected)fail('fixture_failed');diagnosticPassed++;}
           const origin='https://playnixes.com/';
           const rootCases=[['/master.m3u8',origin,origin+'master.m3u8'],['/MASTER.M3U8?token=private',origin,origin+'MASTER.M3U8?token=private'],['/master.m3u8?token=%2f',origin,origin+'master.m3u8?token=%2f'],['//other.fixture.net/master.m3u8',origin,'jw_url_network_relative_rejected'],['/\\other.fixture.net/master.m3u8',origin,'jw_url_relative_backslash_rejected'],['/%2f%2fother/master.m3u8',origin,'jw_url_relative_encoded_separator_rejected'],['/video.mp4',origin,'jw_url_root_relative_not_hls'],['/',origin,'jw_url_root_relative_not_hls'],['/master.m3u8#private',origin,'jw_url_relative_components_rejected'],['/master.m3u8?x= a',origin,'jw_url_relative_characters_rejected'],['/master.m3u8',null,'jw_url_relative_origin_missing'],['/master.m3u8','http://playnixes.com/','jw_url_relative_origin_rejected'],['/master.m3u8','https://other.fixture.net/','jw_url_relative_origin_rejected'],['/master.m3u8','https://u:p@playnixes.com/','jw_url_relative_origin_rejected'],['/master.m3u8','https://playnixes.com/sub/','jw_url_relative_origin_rejected'],['/master.m3u8','https://playnixes.com:444/','jw_url_relative_origin_rejected'],[url,null,url]];
           for(const [value,base,expected] of rootCases){let actual;try{actual=rootSource(value,base);}catch(error){actual=error.message;}if(actual!==expected)fail('fixture_failed');diagnosticPassed++;}
           const savedOrigin=process.env.KOFUM_JW_ORIGIN;
           try{process.env.KOFUM_JW_ORIGIN=origin;if(extract(setup('"/master.m3u8?token=private"')).url!==origin+'master.m3u8?token=private')fail('fixture_failed');diagnosticPassed++;}
           finally{if(savedOrigin===undefined)delete process.env.KOFUM_JW_ORIGIN;else process.env.KOFUM_JW_ORIGIN=savedOrigin;}
          '''
          source = source.replace(marker,extra+' let passed=diagnosticPassed;for(const source of positives)')
          source = source.replace(total_marker,total_marker+'+diagnosticPassed')
          p.write_text(source)
          provenance = {'repository_sha256':repository_sha256,'effective_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'runtime_transform':'same_origin_root_hls_and_url_diagnostics'}
          Path('analysis/jw-extractor-provenance.json').write_text(json.dumps(provenance)+'\n')
          PY
          node --expose-internals tools/extract_jw_hls.cjs --self-test
      - name: Install pinned Python Playwright package
        id: pip
        timeout-minutes: 2
        run: |
          printf '%s\n' python_package_installation > analysis/browser-routing-stage.txt
          python3 -m venv "$RUNNER_TEMP/kofum-venv"
          "$RUNNER_TEMP/kofum-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir playwright==1.64.1
      - name: Install Chromium system dependencies
        id: deps
        timeout-minutes: 10
        run: |
          printf '%s\n' system_dependencies > analysis/browser-routing-stage.txt
          "$RUNNER_TEMP/kofum-venv/bin/python" -m playwright install-deps chromium
      - name: Download pinned Chromium headless shell
        id: download
        timeout-minutes: 2
        run: |
          printf '%s\n' chromium_download > analysis/browser-routing-stage.txt
          "$RUNNER_TEMP/kofum-venv/bin/python" -m playwright install --only-shell chromium
      - name: Capture routing assignments without expanding destination authorization
        id: capture
        timeout-minutes: 2
        run: |
          printf '%s\n' browser_capture > analysis/browser-routing-stage.txt
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/kofum-home" TMPDIR="$RUNNER_TEMP" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" "$RUNNER_TEMP/kofum-venv/bin/python" tools/capture_routing_lists.py
          printf '%s\n' capture_process_completed > analysis/browser-routing-stage.txt
      - name: Publish sanitized browser report and step outcomes only
        if: always()
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          POLICIES_OUTCOME: ${{ steps.policies.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          AST_OUTCOME: ${{ steps.ast.outcome }}
          PIP_OUTCOME: ${{ steps.pip.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, time, urllib.request, urllib.error
          from pathlib import Path
          report = Path('analysis/browser-routing-report.json')
          data = json.loads(report.read_text(encoding='utf-8')) if report.exists() else {'status':'workflow_did_not_produce_report'}
          data['workflow_preceding_status'] = os.environ['PRIOR_STATUS']
          provenance_file = Path('analysis/jw-extractor-provenance.json')
          if provenance_file.exists():
              provenance = json.loads(provenance_file.read_text())
              clean = {key:provenance[key] for key in ('repository_sha256','effective_sha256') if isinstance(provenance.get(key),str) and re.fullmatch(r'[0-9a-f]{64}',provenance[key])}
              if len(clean)==2 and provenance.get('runtime_transform')=='same_origin_root_hls_and_url_diagnostics':
                  clean['runtime_transform']='same_origin_root_hls_and_url_diagnostics'
                  data['jw_extractor_provenance']=clean
          stage_file = Path('analysis/browser-routing-stage.txt')
          stage = stage_file.read_text(encoding='utf-8').strip() if stage_file.exists() else 'initialization_not_completed'
          stages = {'initialization_not_completed','python_policy_checks','node_setup','ast_checks','python_package_installation','system_dependencies','chromium_download','browser_capture','capture_process_completed'}
          data['workflow_stage'] = stage if stage in stages else 'unknown'
          outcomes = {'success','failure','cancelled','skipped'}
          data['workflow_steps'] = {key.lower(): os.environ.get(key+'_OUTCOME','') if os.environ.get(key+'_OUTCOME','') in outcomes else 'unknown' for key in ('POLICIES','NODE','AST','PIP','DEPS','DOWNLOAD','CAPTURE')}
          run_id = os.environ.get('RUN_ID','')
          head_sha = os.environ.get('HEAD_SHA','')
          if re.fullmatch(r'[0-9]+',run_id): data['workflow_run_id'] = run_id
          if re.fullmatch(r'[0-9a-f]{40}',head_sha): data['workflow_head_sha'] = head_sha
          content = (json.dumps(data,ensure_ascii=False,indent=2)+'\n').encode('utf-8')
          report.parent.mkdir(parents=True,exist_ok=True)
          report.write_bytes(content)
          url = 'https://api.github.com/repos/eagleblue2024-pixel/kofum-lat/contents/analysis/browser-routing-report.json'
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Kofum-Lat-browser-observation'}
          def publish_report(url, headers, content, fetch, wait):
              retryable = {409, 429, 500, 502, 503, 504}
              for attempt in range(3):
                  try:
                      payload = {'message':'chore: publish sanitized isolated browser routing report','branch':'main','content':base64.b64encode(content).decode('ascii')}
                      try:
                          with fetch(urllib.request.Request(url+'?ref=main',headers=headers),timeout=10) as response:
                              remote = json.load(response)
                          if base64.b64decode(remote.get('content','')) == content:
                              return
                          payload['sha'] = remote['sha']
                      except urllib.error.HTTPError as error:
                          if error.code != 404:
                              raise
                      request = urllib.request.Request(url,data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
                      with fetch(request,timeout=10) as response:
                          if response.status not in (200,201):
                              raise RuntimeError('report_write_failed')
                      return
                  except urllib.error.HTTPError as error:
                      if error.code not in retryable or attempt == 2:
                          raise RuntimeError('report_publish_http_'+str(error.code)) from None
                  except (urllib.error.URLError, TimeoutError):
                      if attempt == 2:
                          raise RuntimeError('report_publish_network_failed') from None
                  wait(2 ** (attempt+1))
          publish_report(url, headers, content, urllib.request.urlopen, time.sleep)
          PY
      - name: Retain sanitized browser report even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kofum-browser-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            analysis/browser-routing-report.json
            analysis/browser-routing-stage.txt
          if-no-files-found: warn
          retention-days: 14
